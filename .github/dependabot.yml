version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: swift
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      swift-packages:
        patterns:
          - "*"
