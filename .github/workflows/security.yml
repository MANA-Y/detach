name: Security analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize workflow analysis
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - name: Analyze workflows
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:actions

  swift:
    name: swift-${{ matrix.scope }}
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scope: [kit, app, processes]
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore the Swift dependency graph
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/.build
          key: detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-${{ github.sha }}
          restore-keys: |
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('app/Package.resolved', 'scripts/build-tmux.sh') }}-
            detach-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Resolve the locked Swift dependencies
        run: swift package --package-path app --force-resolved-versions resolve
      - name: Remove cached products before tracing
        run: swift package --package-path app clean
      - name: Prepare shared Swift source outside scope tracing
        if: matrix.scope != 'kit'
        run: swift build --package-path app --target DetachKit --arch arm64 --jobs 3 --disable-index-store --disable-sandbox --force-resolved-versions
      - name: Initialize Swift analysis
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build Swift kit source for analysis
        if: matrix.scope == 'kit'
        run: swift build --package-path app --target DetachKit --arch arm64 --jobs 3 --disable-index-store --disable-sandbox --force-resolved-versions -Xswiftc -disable-batch-mode
      - name: Build Swift app source for analysis
        if: matrix.scope == 'app'
        run: swift build --package-path app --target DetachApp --arch arm64 --jobs 3 --disable-index-store --disable-sandbox --force-resolved-versions -Xswiftc -disable-batch-mode
      - name: Build Swift process entry points for analysis
        if: matrix.scope == 'processes'
        run: |
          swift build --package-path app --target DetachPower --arch arm64 --jobs 3 --disable-index-store --disable-sandbox --force-resolved-versions -Xswiftc -disable-batch-mode
          swift build --package-path app --target DetachPowerHelper --arch arm64 --jobs 3 --disable-index-store --disable-sandbox --force-resolved-versions -Xswiftc -disable-batch-mode
          swift build --package-path app --target DetachState --arch arm64 --jobs 3 --disable-index-store --disable-sandbox --force-resolved-versions -Xswiftc -disable-batch-mode
          swift build --package-path app --target DetachWatchdog --arch arm64 --jobs 3 --disable-index-store --disable-sandbox --force-resolved-versions -Xswiftc -disable-batch-mode
      - name: Analyze Swift scope
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:swift-${{ matrix.scope }}
